<svg xmlns="http://www.w3.org/2000/svg" width="310" height="56" viewBox="0 0 310 56" role="img" aria-label="Add Sources to Aidoku">
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="52%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="btnSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btnSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="btnClip"><rect x="1.5" y="1.5" width="307" height="53" rx="13.5"/></clipPath>
  </defs>
  <rect x="1.5" y="1.5" width="307" height="53" rx="13.5" fill="url(#btnGrad)"/>
  <rect x="1.5" y="1.5" width="307" height="25" rx="13.5" fill="url(#btnSheen)"/>
  <circle cx="34" cy="28" r="12.5" fill="#0b1322" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M34 21.5 v13 M27.5 28 h13" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  <text x="176" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0.2">Add Sources to Aidoku</text>
  <g clip-path="url(#btnClip)">
    <g transform="skewX(-18)">
      <rect x="0" y="-14" width="44" height="84" fill="url(#btnSweep)">
        <animateTransform attributeName="transform" type="translate" values="-90 0; 370 0; 370 0" keyTimes="0; 0.32; 1" dur="4s" repeatCount="indefinite"/>
